name: f7-task5-workflow-repair

on:
  push:
    branches:
      - feat/f7-text-v1
    paths:
      - .github/workflows/f7-task5-workflow-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize native source before exact anchor patch
        shell: pwsh
        run: |
          $path = '.github/workflows/f7-task5-text-discovery-green.yml'
          $content = Get-Content $path -Raw
          $old = "          `$native = Get-Content `$nativePath -Raw"
          $new = "          `$native = Get-Content `$nativePath -Raw`n          `$native = `$native -replace \"``r``n\", \"``n\""
          if (($content.Split($old).Length - 1) -ne 1) {
            throw 'Expected exactly one native-read line in Task 5 workflow.'
          }
          $content = $content.Replace($old, $new)
          Set-Content -Path $path -Value $content -Encoding utf8

          Remove-Item '.github/workflows/f7-task5-workflow-repair.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(f7): repair task5 patch newline handling'
          git push
