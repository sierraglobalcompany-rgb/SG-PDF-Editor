name: build

on:
  push:
    branches: [ main, 'feat/**', 'plan/**', 'tmp/**' ]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate repository hygiene
        shell: pwsh
        run: |
          if (-not (Test-Path "third_party/manifest.json")) {
            throw "third_party/manifest.json is required"
          }
          Get-Content "third_party/manifest.json" -Raw | ConvertFrom-Json | Out-Null
          $privateTracked = git ls-files "tests/PrivateFixtures/**"
          if ($privateTracked) {
            throw "Private fixtures must not be committed: $privateTracked"
          }
          $runtimeTracked = git ls-files "third_party/runtime/**"
          if ($runtimeTracked) {
            throw "Staged third-party runtime binaries must not be committed: $runtimeTracked"
          }

      - name: Stage pinned Labelize 1.7.0
        shell: pwsh
        run: ./tools/setup-labelize.ps1

      - name: Regenerate lock probe
        shell: pwsh
        run: |
          dotnet restore SGPdf.slnx --force-evaluate
          Write-Host '--- SGPDF APP LOCK START ---'
          Get-Content src/SGPdf.App/packages.lock.json -Raw
          Write-Host '--- SGPDF APP LOCK END ---'
          Write-Host '--- SGPDF TEST LOCK START ---'
          Get-Content tests/SGPdf.App.Tests/packages.lock.json -Raw
          Write-Host '--- SGPDF TEST LOCK END ---'

      - name: Build
        run: dotnet build SGPdf.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test SGPdf.slnx --configuration Release --no-build
