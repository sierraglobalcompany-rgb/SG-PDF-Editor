name: diagnose-f13-task5-bisection

on:
  push:
    branches: [ 'feat/diag-f13-task5-parallelism-20261015' ]

permissions:
  contents: read

jobs:
  windows:
    name: ${{ matrix.group }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: task5-only
            filter: FullyQualifiedName~SGPdf.App.Tests.MainWindowToolRailTests
          - group: everything-except-task5
            filter: FullyQualifiedName!~SGPdf.App.Tests.MainWindowToolRailTests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate repository hygiene
        shell: pwsh
        run: |
          if (-not (Test-Path "third_party/manifest.json")) {
            throw "third_party/manifest.json is required"
          }
          Get-Content "third_party/manifest.json" -Raw | ConvertFrom-Json | Out-Null
          $privateTracked = git ls-files "tests/PrivateFixtures/**"
          if ($privateTracked) {
            throw "Private fixtures must not be committed: $privateTracked"
          }
          $runtimeTracked = git ls-files "third_party/runtime/**"
          if ($runtimeTracked) {
            throw "Staged third-party runtime binaries must not be committed: $runtimeTracked"
          }

      - name: Stage pinned Labelize 1.7.0
        shell: pwsh
        run: ./tools/setup-labelize.ps1

      - name: Stage pinned qpdf 12.4.2
        shell: pwsh
        run: ./tools/setup-qpdf.ps1

      - name: Stage pinned Tesseract 5.5.3
        shell: pwsh
        run: ./tools/setup-tesseract.ps1

      - name: Restore locked dependencies
        run: dotnet restore SGPdf.slnx --locked-mode

      - name: Build
        run: dotnet build SGPdf.slnx --configuration Release --no-restore

      - name: Test ${{ matrix.group }}
        run: dotnet test SGPdf.slnx --configuration Release --no-build --no-restore --filter "${{ matrix.filter }}"
