name: diagnostic-reader

on:
  push:
    branches: [ 'feat/f4-full-reader' ]

permissions:
  contents: read

jobs:
  isolate-reader-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Stage pinned Labelize 1.7.0
        shell: pwsh
        run: ./tools/setup-labelize.ps1
      - name: Restore
        run: dotnet restore SGPdf.slnx --locked-mode
      - name: Build
        run: dotnet build SGPdf.slnx --configuration Release --no-restore
      - name: Isolate hang stages
        shell: pwsh
        run: |
          $tests = @(
            'SGPdf.App.Tests.ReaderHangDiagnosticsTests.OpenWithSyntheticRenderer_WithoutClose_Completes',
            'SGPdf.App.Tests.ReaderHangDiagnosticsTests.OpenWithRealRenderer_WithoutClose_Completes',
            'SGPdf.App.Tests.ReaderHangDiagnosticsTests.OpenWithSyntheticRenderer_ThenClose_Completes',
            'SGPdf.App.Tests.MainWindowReaderTests.LeerMode_ShowsContinuousSurfaceAndHidesSinglePageEditSurface'
          )
          foreach ($test in $tests) {
            Write-Host "=== RUN $test ==="
            $arguments = @(
              'test', 'tests/SGPdf.App.Tests/SGPdf.App.Tests.csproj',
              '--configuration', 'Release', '--no-build',
              '--filter', "FullyQualifiedName=$test"
            )
            $process = Start-Process dotnet -ArgumentList $arguments -PassThru -NoNewWindow
            if (-not $process.WaitForExit(20000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "HANG: $test"
            }
            if ($process.ExitCode -ne 0) {
              throw "FAIL: $test (exit $($process.ExitCode))"
            }
            Write-Host "=== PASS $test ==="
          }
