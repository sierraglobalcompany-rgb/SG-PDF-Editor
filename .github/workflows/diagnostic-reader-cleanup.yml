name: diagnostic-reader-cleanup

on:
  push:
    branches: [ 'feat/f4-full-reader' ]

permissions:
  contents: read

jobs:
  reveal-reader-failures:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Stage pinned Labelize 1.7.0
        shell: pwsh
        run: ./tools/setup-labelize.ps1
      - name: Patch test cleanup only
        shell: pwsh
        run: |
          $path = 'tests/SGPdf.App.Tests/MainWindowReaderTests.cs'
          $text = Get-Content $path -Raw
          $old = @'
    private static void CloseClean(MainWindow window)
    {
        if (GetOptionalField(window, "_signatureEditState") is SignatureEditState state)
            state.DiscardAll();
        window.Close();
    }
'@
          $new = @'
    private static void CloseClean(MainWindow window)
    {
        if (GetOptionalField(window, "_signatureEditState") is SignatureEditState state)
            state.DiscardAll();
        window.Close();
        if (GetOptionalField(window, "_session") is PdfDocumentSession session)
        {
            session.Dispose();
            SetField(window, "_session", null!);
        }
    }
'@
          if (-not $text.Contains($old)) { throw 'CloseClean pattern not found' }
          Set-Content $path ($text.Replace($old, $new)) -NoNewline
      - name: Restore
        run: dotnet restore SGPdf.slnx --locked-mode
      - name: Build
        run: dotnet build SGPdf.slnx --configuration Release --no-restore
      - name: Test reader task 2
        run: dotnet test tests/SGPdf.App.Tests/SGPdf.App.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~MainWindowReaderTests|FullyQualifiedName~ReaderPageItemTests"
