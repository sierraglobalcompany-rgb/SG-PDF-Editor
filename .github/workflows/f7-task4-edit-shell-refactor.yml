name: f7-task4-edit-shell-refactor

on:
  push:
    branches:
      - feat/f7-text-v1

permissions:
  contents: write

jobs:
  refactor:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generalize EDITAR shell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git mv "src/SGPdf.App/MainWindow.EditImages.cs" "src/SGPdf.App/MainWindow.Edit.cs"
          git mv "src/SGPdf.App/MainWindow.EditImages.Hardening.cs" "src/SGPdf.App/MainWindow.Edit.Hardening.cs"

          $pairs = @(
            @('ImageEditLoadedHookRegistered', 'EditLoadedHookRegistered'),
            @('_imageEditUiInitialized', '_editUiInitialized'),
            @('_imageEditModeActive', '_editModeActive'),
            @('_imageEditMaterializing', '_editMaterializing'),
            @('_imageEditModeButton', '_editModeButton'),
            @('_imageEditSaveAsButton', '_editSaveAsButton'),
            @('_imageEditOverlayCanvas', '_editOverlayCanvas'),
            @('RegisterImageEditLoadedHook', 'RegisterEditLoadedHook'),
            @('ImageEditHost_Loaded', 'EditHost_Loaded'),
            @('InitializeImageEditUi', 'InitializeEditUi'),
            @('ImageEditMode_Click', 'EditMode_Click'),
            @('ImageEditSaveAs_Click', 'EditSaveAs_Click'),
            @('TrySaveImageEditWorkspace', 'TrySaveEditWorkspace'),
            @('UpdateImageEditSaveCommandAvailability', 'UpdateEditSaveCommandAvailability'),
            @('TryEnterImageEditModeAsync', 'TryEnterEditModeAsync'),
            @('ShowImageEditBlock', 'ShowEditBlock'),
            @('ImageEditHost_PreviewKeyDown', 'EditHost_PreviewKeyDown'),
            @('ExistingModeAfterImageEdit_Click', 'ExistingModeAfterEdit_Click'),
            @('ResetImageEditState', 'ResetEditState'),
            @('ImageEditOpenMenuGuardRegistered', 'EditOpenMenuGuardRegistered'),
            @('RegisterImageEditOpenMenuGuard', 'RegisterEditOpenMenuGuard'),
            @('ImageEditOpenMenuItem_Click', 'EditOpenMenuItem_Click'),
            @('WireImageEditGuards', 'WireEditGuards'),
            @('GuardedImageEditModeButton_PreviewMouseLeftButtonDown', 'GuardedEditModeButton_PreviewMouseLeftButtonDown'),
            @('TryLeaveImageEditModeWithGuard', 'TryLeaveEditModeWithGuard'),
            @('ImageEditWindow_Closing', 'EditWindow_Closing'),
            @('_selectImageEditPdfDestination', '_selectEditPdfDestination'),
            @('_inspectImageEditPreflight', '_inspectEditPreflight'),
            @('_confirmImageEditWarnings', '_confirmEditWarnings'),
            @('ImageEditSaveAsButton', 'EditSaveAsButton'),
            @('ImageEditOverlayCanvas', 'EditOverlayCanvas')
          )

          $redGate = [System.IO.Path]::GetFullPath('tests/SGPdf.App.Tests/EditModeShellNamingTests.cs')
          $files = Get-ChildItem src,tests -Recurse -File -Filter *.cs | Where-Object { $_.FullName -ne $redGate }
          foreach ($file in $files) {
            $content = [System.IO.File]::ReadAllText($file.FullName)
            $updated = $content
            foreach ($pair in $pairs) {
              $updated = $updated.Replace($pair[0], $pair[1])
            }
            if ($updated -ne $content) {
              [System.IO.File]::WriteAllText($file.FullName, $updated, [System.Text.UTF8Encoding]::new($false))
            }
          }

          if (Test-Path 'src/SGPdf.App/MainWindow.EditImages.cs') { throw 'Legacy MainWindow.EditImages.cs still exists.' }
          if (Test-Path 'src/SGPdf.App/MainWindow.EditImages.Hardening.cs') { throw 'Legacy MainWindow.EditImages.Hardening.cs still exists.' }
          if (-not (Test-Path 'src/SGPdf.App/MainWindow.Edit.cs')) { throw 'MainWindow.Edit.cs was not created.' }
          if (-not (Test-Path 'src/SGPdf.App/MainWindow.Edit.Hardening.cs')) { throw 'MainWindow.Edit.Hardening.cs was not created.' }

          Remove-Item '.github/workflows/f7-task4-edit-shell-refactor.yml'
          git add -A
          git status --short
          git commit -m "refactor(edit): generalize edit mode shell"
          git push origin HEAD:feat/f7-text-v1
