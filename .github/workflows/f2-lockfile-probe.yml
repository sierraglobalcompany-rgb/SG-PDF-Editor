name: f2-lockfile-probe

on:
  push:
    branches: [ 'feat/f2-2-labelize-preview' ]

permissions:
  contents: read

jobs:
  generate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Regenerate test lockfile
        run: dotnet restore tests/SGPdf.App.Tests/SGPdf.App.Tests.csproj --force-evaluate
      - uses: actions/upload-artifact@v4
        with:
          name: f2-test-lockfile
          path: tests/SGPdf.App.Tests/packages.lock.json
          if-no-files-found: error
