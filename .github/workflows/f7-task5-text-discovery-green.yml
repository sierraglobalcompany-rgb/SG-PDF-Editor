name: f7-task5-text-discovery-green

on:
  push:
    branches:
      - feat/f7-text-v1
    paths:
      - .github/workflows/f7-task5-text-discovery-green.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Implement Task 5 GREEN
        shell: pwsh
        run: |
          $modelPath = 'src/SGPdf.App/Features/Edit/Text/PdfTextObjectInfo.cs'
          $model = @'
          using SGPdf.App.Pdf;

          namespace SGPdf.App.Features.Edit.Text;

          internal readonly record struct TextObjectKey(
              int PageIndex,
              int PageObjectIndex);

          internal readonly record struct PdfTextFillColor(
              uint Red,
              uint Green,
              uint Blue,
              uint Alpha);

          internal readonly record struct PdfTextObjectQuad(
              double X1,
              double Y1,
              double X2,
              double Y2,
              double X3,
              double Y3,
              double X4,
              double Y4);

          internal sealed record PdfTextObjectInfo(
              TextObjectKey Key,
              string Text,
              PdfObjectMatrix Matrix,
              PdfObjectBounds Bounds,
              PdfTextObjectQuad Quad,
              string FontName,
              double FontSize,
              PdfTextFillColor FillColor,
              int TextRenderMode);
          '@
          $model = ($model -split "`r?`n" | ForEach-Object { $_ -replace '^          ', '' }) -join "`n"
          Set-Content -Path $modelPath -Value $model -Encoding utf8

          $sessionPath = 'src/SGPdf.App/Pdf/PdfDocumentSession.TextObjects.cs'
          $session = @'
          using System.Runtime.InteropServices;
          using System.Text;
          using SGPdf.App.Features.Edit.Text;

          namespace SGPdf.App.Pdf;

          public sealed partial class PdfDocumentSession
          {
              internal IReadOnlyList<PdfTextObjectInfo> GetTextObjects(
                  int pageIndex,
                  CancellationToken cancellationToken = default)
              {
                  cancellationToken.ThrowIfCancellationRequested();
                  ValidatePageIndex(pageIndex, cancellationToken);

                  PdfiumRuntime.NativeGate.Wait(cancellationToken);
                  try
                  {
                      cancellationToken.ThrowIfCancellationRequested();
                      ThrowIfDisposed();

                      var page = PdfiumNative.FPDF_LoadPage(_document, pageIndex);
                      if (page == IntPtr.Zero)
                          throw new InvalidOperationException($"No se pudo cargar la página {pageIndex + 1} para inspeccionar texto.");

                      IntPtr textPage = IntPtr.Zero;
                      try
                      {
                          textPage = PdfiumNative.FPDFText_LoadPage(page);
                          if (textPage == IntPtr.Zero)
                              throw new InvalidOperationException($"PDFium no pudo cargar la capa de texto de la página {pageIndex + 1}.");

                          var objectCount = PdfiumNative.FPDFPage_CountObjects(page);
                          if (objectCount < 0)
                              throw new InvalidOperationException("PDFium devolvió una cantidad inválida de objetos de página.");

                          var objects = new List<PdfTextObjectInfo>();
                          for (var objectIndex = 0; objectIndex < objectCount; objectIndex++)
                          {
                              cancellationToken.ThrowIfCancellationRequested();
                              var pageObject = PdfiumNative.FPDFPage_GetObject(page, objectIndex);
                              if (pageObject == IntPtr.Zero)
                                  throw new InvalidOperationException($"PDFium no pudo resolver el objeto {objectIndex} de la página {pageIndex + 1}.");

                              if (PdfiumNative.FPDFPageObj_GetType(pageObject) != PdfiumNative.FPDF_PAGEOBJ_TEXT)
                                  continue;

                              var snapshot = TryReadTextObjectSnapshot(
                                  pageIndex,
                                  objectIndex,
                                  pageObject,
                                  textPage);
                              if (snapshot is not null)
                                  objects.Add(snapshot);
                          }

                          cancellationToken.ThrowIfCancellationRequested();
                          return objects.AsReadOnly();
                      }
                      finally
                      {
                          if (textPage != IntPtr.Zero)
                              PdfiumNative.FPDFText_ClosePage(textPage);
                          PdfiumNative.FPDF_ClosePage(page);
                      }
                  }
                  finally
                  {
                      PdfiumRuntime.NativeGate.Release();
                  }
              }

              private static PdfTextObjectInfo? TryReadTextObjectSnapshot(
                  int pageIndex,
                  int objectIndex,
                  IntPtr pageObject,
                  IntPtr textPage)
              {
                  var text = ReadTextObjectText(pageObject, textPage);
                  if (string.IsNullOrEmpty(text))
                      return null;

                  if (PdfiumNative.FPDFPageObj_GetMatrix(pageObject, out var matrix) == 0 ||
                      PdfiumNative.FPDFPageObj_GetBounds(
                          pageObject,
                          out var left,
                          out var bottom,
                          out var right,
                          out var top) == 0 ||
                      PdfiumNative.FPDFPageObj_GetRotatedBounds(pageObject, out var quad) == 0 ||
                      PdfiumNative.FPDFTextObj_GetFontSize(pageObject, out var fontSize) == 0 ||
                      !float.IsFinite(fontSize) ||
                      fontSize <= 0f)
                  {
                      return null;
                  }

                  var font = PdfiumNative.FPDFTextObj_GetFont(pageObject);
                  if (font == IntPtr.Zero)
                      return null;

                  var fontName = ReadBaseFontName(font);
                  if (string.IsNullOrWhiteSpace(fontName))
                      return null;

                  if (PdfiumNative.FPDFPageObj_GetFillColor(
                          pageObject,
                          out var red,
                          out var green,
                          out var blue,
                          out var alpha) == 0)
                  {
                      return null;
                  }

                  var renderMode = PdfiumNative.FPDFTextObj_GetTextRenderMode(pageObject);
                  if (renderMode < 0)
                      return null;

                  var managedMatrix = new PdfObjectMatrix(
                      matrix.A,
                      matrix.B,
                      matrix.C,
                      matrix.D,
                      matrix.E,
                      matrix.F);
                  var managedBounds = new PdfObjectBounds(left, bottom, right, top);
                  var managedQuad = new PdfTextObjectQuad(
                      quad.X1,
                      quad.Y1,
                      quad.X2,
                      quad.Y2,
                      quad.X3,
                      quad.Y3,
                      quad.X4,
                      quad.Y4);

                  if (!IsValidTextGeometry(managedMatrix, managedBounds, managedQuad))
                      return null;

                  return new PdfTextObjectInfo(
                      new TextObjectKey(pageIndex, objectIndex),
                      text,
                      managedMatrix,
                      managedBounds,
                      managedQuad,
                      fontName,
                      fontSize,
                      new PdfTextFillColor(red, green, blue, alpha),
                      renderMode);
              }

              private static string ReadTextObjectText(IntPtr textObject, IntPtr textPage)
              {
                  var required = PdfiumNative.FPDFTextObj_GetText(textObject, textPage, IntPtr.Zero, 0);
                  if (required == 0 || required > int.MaxValue)
                      return string.Empty;

                  var charCapacity = checked((int)required);
                  var buffer = Marshal.AllocHGlobal(checked(charCapacity * sizeof(ushort)));
                  try
                  {
                      var copied = PdfiumNative.FPDFTextObj_GetText(textObject, textPage, buffer, required);
                      if (copied == 0 || copied > required)
                          return string.Empty;

                      var raw = new short[checked((int)copied)];
                      Marshal.Copy(buffer, raw, 0, raw.Length);
                      var length = raw.Length;
                      while (length > 0 && raw[length - 1] == 0)
                          length--;

                      var chars = new char[length];
                      for (var index = 0; index < length; index++)
                          chars[index] = (char)(ushort)raw[index];
                      return new string(chars);
                  }
                  finally
                  {
                      Marshal.FreeHGlobal(buffer);
                  }
              }

              private static string ReadBaseFontName(IntPtr font)
              {
                  var required = PdfiumNative.FPDFFont_GetBaseFontName(font, IntPtr.Zero, 0);
                  if (required == 0 || required > int.MaxValue)
                      return string.Empty;

                  var buffer = Marshal.AllocHGlobal(checked((int)required));
                  try
                  {
                      var copied = PdfiumNative.FPDFFont_GetBaseFontName(font, buffer, required);
                      if (copied == 0 || copied > required || copied > int.MaxValue)
                          return string.Empty;

                      var bytes = new byte[checked((int)copied)];
                      Marshal.Copy(buffer, bytes, 0, bytes.Length);
                      var length = bytes.Length;
                      while (length > 0 && bytes[length - 1] == 0)
                          length--;
                      return Encoding.UTF8.GetString(bytes, 0, length);
                  }
                  finally
                  {
                      Marshal.FreeHGlobal(buffer);
                  }
              }

              private static bool IsValidTextGeometry(
                  PdfObjectMatrix matrix,
                  PdfObjectBounds bounds,
                  PdfTextObjectQuad quad)
              {
                  return double.IsFinite(matrix.A) &&
                         double.IsFinite(matrix.B) &&
                         double.IsFinite(matrix.C) &&
                         double.IsFinite(matrix.D) &&
                         double.IsFinite(matrix.E) &&
                         double.IsFinite(matrix.F) &&
                         double.IsFinite(bounds.Left) &&
                         double.IsFinite(bounds.Bottom) &&
                         double.IsFinite(bounds.Right) &&
                         double.IsFinite(bounds.Top) &&
                         bounds.Right > bounds.Left &&
                         bounds.Top > bounds.Bottom &&
                         double.IsFinite(quad.X1) &&
                         double.IsFinite(quad.Y1) &&
                         double.IsFinite(quad.X2) &&
                         double.IsFinite(quad.Y2) &&
                         double.IsFinite(quad.X3) &&
                         double.IsFinite(quad.Y3) &&
                         double.IsFinite(quad.X4) &&
                         double.IsFinite(quad.Y4);
              }
          }
          '@
          $session = ($session -split "`r?`n" | ForEach-Object { $_ -replace '^          ', '' }) -join "`n"
          Set-Content -Path $sessionPath -Value $session -Encoding utf8

          $nativePath = 'src/SGPdf.App/Pdf/PdfiumNative.cs'
          $native = Get-Content $nativePath -Raw
          $constantOld = '    internal const int FPDF_PAGEOBJ_IMAGE = 3;'
          $constantNew = "    internal const int FPDF_PAGEOBJ_TEXT = 1;`n    internal const int FPDF_PAGEOBJ_IMAGE = 3;"
          if (($native.Split($constantOld).Length - 1) -ne 1) {
            throw 'Expected exactly one FPDF_PAGEOBJ_IMAGE constant marker.'
          }
          $native = $native.Replace($constantOld, $constantNew)

          $anchor = @'
              [DllImport(Library, CallingConvention = CallingConvention.StdCall)]
              internal static extern IntPtr FPDFText_LoadPage(IntPtr page);
          '@
          $anchor = ($anchor -split "`r?`n" | ForEach-Object { $_ -replace '^              ', '' }) -join "`n"
          $imports = @'
              [DllImport(Library, CallingConvention = CallingConvention.StdCall)]
              internal static extern uint FPDFTextObj_GetText(
                  IntPtr textObject,
                  IntPtr textPage,
                  IntPtr buffer,
                  uint length);

              [DllImport(Library, CallingConvention = CallingConvention.StdCall)]
              internal static extern int FPDFTextObj_GetFontSize(IntPtr textObject, out float size);

              [DllImport(Library, CallingConvention = CallingConvention.StdCall)]
              internal static extern IntPtr FPDFTextObj_GetFont(IntPtr textObject);

              [DllImport(Library, CallingConvention = CallingConvention.StdCall)]
              internal static extern nuint FPDFFont_GetBaseFontName(IntPtr font, IntPtr buffer, nuint length);

              [DllImport(Library, CallingConvention = CallingConvention.StdCall)]
              internal static extern int FPDFTextObj_GetTextRenderMode(IntPtr textObject);

              [DllImport(Library, CallingConvention = CallingConvention.StdCall)]
              internal static extern int FPDFPageObj_GetFillColor(
                  IntPtr pageObject,
                  out uint red,
                  out uint green,
                  out uint blue,
                  out uint alpha);

          '@
          $imports = ($imports -split "`r?`n" | ForEach-Object { $_ -replace '^              ', '' }) -join "`n"
          if (($native.Split($anchor).Length - 1) -ne 1) {
            throw 'Expected exactly one FPDFText_LoadPage anchor.'
          }
          $native = $native.Replace($anchor, $imports + $anchor)
          Set-Content -Path $nativePath -Value $native -Encoding utf8

          Remove-Item '.github/workflows/f7-task5-text-discovery-green.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(f7): discover top-level pdf text objects'
          git push
